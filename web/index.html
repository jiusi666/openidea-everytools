<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EveryTools 中文效率小工具</title>
<style>
  /* 面板跑在 IDE 的沙箱里：没有自己的网络也没有 storage。
     工具清单、选项控件、结果全部由插件推过来，这里只负责画。
     所有颜色走变量，深色跟随 IDE / 系统主题。 */
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --bg-soft: #fafbfc;
    --fg: #1f2328;
    --fg-dim: #57606a;
    --muted: #8b949e;
    --line: #e8eaed;
    --line-strong: #d8dade;
    --hover: rgba(0, 0, 0, .045);
    --accent: #2f6feb;
    --accent-soft: #eaf1fe;
    --warn: #9a6700;
    --warn-bg: #fdf6e3;
    --ok: #1f883d;
    --shadow: 0 6px 24px rgba(31, 35, 40, .14), 0 1px 3px rgba(31, 35, 40, .08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1e1e1e;
      --bg-soft: #232323;
      --fg: #d8dbe0;
      --fg-dim: #a8adb5;
      --muted: #7d838b;
      --line: #33383d;
      --line-strong: #444a51;
      --hover: rgba(255, 255, 255, .065);
      --accent: #4c8dff;
      --accent-soft: rgba(76, 141, 255, .16);
      --warn: #d29922;
      --warn-bg: rgba(210, 153, 34, .13);
      --ok: #3fb950;
      --shadow: 0 8px 28px rgba(0, 0, 0, .5), 0 1px 3px rgba(0, 0, 0, .4);
    }
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font: 12px/1.55 -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body { display: flex; flex-direction: column; overflow: hidden; }
  button, input, textarea, select { font: inherit; color: inherit; }
  .grow { flex: 1; }
  ::selection { background: var(--accent-soft); }

  /* 面板被拉得很宽时才收一下行宽；正常侧栏宽度就是满宽 */
  .wrap { width: 100%; max-width: 760px; margin: 0 auto; }

  /* ---------- 顶栏：一个工具选择器，没有别的 ---------- */
  header {
    position: relative;
    flex: none;
    padding: 8px;
    border-bottom: 1px solid var(--line);
    background: var(--bg);
  }
  header .wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    position: relative;
  }
  .picker {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 8px;
    height: 30px;
    padding: 0 8px 0 10px;
    border: 1px solid var(--line-strong);
    border-radius: 7px;
    background: var(--bg-soft);
    cursor: pointer;
    text-align: left;
    transition: border-color .12s, background .12s;
  }
  .picker:hover { border-color: var(--muted); }
  .picker[aria-expanded="true"] {
    border-color: var(--accent);
    background: var(--bg);
  }
  .picker[aria-expanded="true"] .chev { transform: rotate(180deg); }
  .picker:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; }
  .picker-name {
    flex: 1;
    min-width: 0;
    font-size: 12.5px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .picker .chev {
    flex: none;
    color: var(--muted);
    transition: transform .14s ease;
  }
  .dot {
    flex: none;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--muted);
    opacity: .5;
    cursor: default;
  }
  .dot.ok { background: var(--ok); opacity: 1; }

  /* ---------- 工具浮层（带搜索） ---------- */
  .palette {
    position: absolute;
    top: calc(100% - 1px);
    left: 0;
    right: 0;
    z-index: 60;
    display: flex;
    flex-direction: column;
    max-height: 58vh;
    max-height: min(58vh, 400px);
    background: var(--bg);
    border: 1px solid var(--line-strong);
    border-radius: 8px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .palette[hidden] { display: none; }
  .palette-head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 0 10px;
    border-bottom: 1px solid var(--line);
    background: var(--bg-soft);
  }
  .palette-head svg { flex: none; color: var(--muted); }
  .palette-search {
    flex: 1;
    min-width: 0;
    height: 34px;
    padding: 0;
    border: none;
    background: transparent;
    font-size: 12px;
    outline: none;
  }
  .palette-search::placeholder { color: var(--muted); }
  .palette-list { overflow-y: auto; padding: 4px; }
  .pgroup {
    padding: 7px 8px 2px;
    font-size: 10px;
    letter-spacing: .4px;
    color: var(--muted);
  }
  .pitem {
    display: block;
    width: 100%;
    padding: 4px 8px;
    border: none;
    border-radius: 5px;
    background: transparent;
    cursor: pointer;
    text-align: left;
  }
  .pitem:hover { background: var(--hover); }
  .pitem.on { background: var(--accent-soft); }
  .pitem .nm {
    display: block;
    font-size: 12px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .pitem.on .nm { color: var(--accent); font-weight: 600; }
  .pitem .sm {
    display: block;
    font-size: 10.5px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .pitem.on .sm { color: var(--accent); opacity: .75; }
  .pempty { padding: 14px 10px; color: var(--muted); text-align: center; }

  /* ---------- 主体 ---------- */
  main {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 10px 8px 16px;
  }  .block { margin-bottom: 14px; }
  .block:last-child { margin-bottom: 0; }
  .block-head {
    display: flex;
    align-items: center;
    gap: 6px;
    min-height: 22px;
    margin-bottom: 5px;
  }
  .block-title {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .3px;
    color: var(--muted);
  }
  .block-hint { font-size: 10.5px; color: var(--muted); }

  /* 输入 */
  .input-wrap { position: relative; }
  textarea {
    display: block;
    width: 100%;
    height: 68px;
    min-height: 68px;
    max-height: 42vh;
    padding: 7px 9px;
    border: 1px solid var(--line-strong);
    border-radius: 7px;
    background: var(--bg-soft);
    font-family: ui-monospace, "Cascadia Code", Consolas, "Microsoft YaHei", monospace;
    font-size: 11.5px;
    line-height: 1.55;
    resize: none;
    overflow: auto;
    transition: border-color .12s;
  }
  textarea::placeholder { color: var(--muted); font-family: inherit; }
  textarea:hover { border-color: var(--muted); }
  textarea:focus { border-color: var(--accent); outline: none; }

  /* 选项折叠条 */
  .fold {
    border: 1px solid var(--line);
    border-radius: 7px;
    background: var(--bg-soft);
    overflow: hidden;
  }
  .fold > summary {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 9px;
    cursor: pointer;
    list-style: none;
    font-size: 11px;
    user-select: none;
  }
  .fold > summary::-webkit-details-marker { display: none; }
  .fold > summary:hover { background: var(--hover); }
  .fold-title { font-weight: 600; color: var(--fg-dim); flex: none; }
  .fold-title::before {
    content: "›";
    display: inline-block;
    width: 9px;
    margin-right: 3px;
    color: var(--muted);
    font-weight: 400;
    transition: transform .14s ease;
  }
  .fold[open] .fold-title::before { transform: rotate(90deg); }
  .fold-note {
    flex: 1;
    min-width: 0;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-align: right;
  }
  .fold-body {
    padding: 2px 9px 9px;
    border-top: 1px solid var(--line);
  }
  #options { display: flex; flex-direction: column; gap: 7px; padding-top: 7px; }
  .field { display: flex; align-items: center; gap: 8px; }
  .field > label {
    flex: none;
    width: 76px;
    color: var(--fg-dim);
    font-size: 11px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .field input[type="text"], .field input[type="number"], .field select {
    flex: 1;
    min-width: 0;
    height: 26px;
    padding: 0 7px;
    border: 1px solid var(--line-strong);
    border-radius: 6px;
    background: var(--bg);
  }
  .field input::placeholder { color: var(--muted); }
  .field input:focus, .field select:focus { border-color: var(--accent); outline: none; }
  .check { display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 11.5px; }
  .check input { accent-color: var(--accent); margin: 0; flex: none; }

  /* 结果卡片 */
  .sec {
    border: 1px solid var(--line);
    border-radius: 7px;
    overflow: hidden;
    margin-bottom: 8px;
    background: var(--bg-soft);
  }
  .sec:last-child { margin-bottom: 0; }
  .sec-head {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 5px 4px 9px;
    border-bottom: 1px solid var(--line);
    background: var(--bg);
  }
  .sec-title {
    flex: 1;
    min-width: 0;
    font-size: 11px;
    font-weight: 600;
    color: var(--fg-dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .sec .out {
    margin: 0;
    padding: 8px 9px;
    font-family: ui-monospace, "Cascadia Code", Consolas, "Microsoft YaHei", monospace;
    font-size: 11.5px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 46vh;
    overflow: auto;
  }
  /* 分段复制默认不抢戏，鼠标进到卡片才提亮 */
  .sec-head .btn { padding: 0 6px; font-size: 10.5px; opacity: .7; }
  .sec:hover .sec-head .btn, .sec-head .btn:focus-visible { opacity: 1; }
  .notes {
    margin: 6px 0 0;
    padding: 6px 9px 6px 24px;
    border-radius: 7px;
    background: var(--warn-bg);
    color: var(--warn);
    font-size: 11px;
  }
  .notes:empty { display: none; }
  .notes li + li { margin-top: 2px; }

  /* 空态 */
  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 26px 16px;
    border: 1px dashed var(--line-strong);
    border-radius: 7px;
    color: var(--muted);
    text-align: center;
  }
  .empty-state svg { opacity: .5; }
  .empty-state p { margin: 0; font-size: 11px; line-height: 1.7; }
  .empty-state kbd {
    padding: 1px 4px;
    border: 1px solid var(--line-strong);
    border-radius: 4px;
    background: var(--bg-soft);
    font-family: inherit;
    font-size: 10px;
  }

  /* 按钮 */
  button {
    border: 1px solid var(--line-strong);
    border-radius: 6px;
    background: transparent;
    cursor: pointer;
    transition: background .12s, border-color .12s, color .12s;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    height: 24px;
    padding: 0 8px;
    font-size: 11px;
    white-space: nowrap;
  }
  .btn:hover { background: var(--hover); border-color: var(--muted); }
  .btn:active { background: var(--line); }
  .btn:disabled { opacity: .4; cursor: default; background: transparent; }
  .btn:disabled:hover { border-color: var(--line-strong); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .btn.ghost { border-color: transparent; color: var(--muted); }
  .btn.ghost:hover { color: var(--fg); border-color: transparent; background: var(--hover); }
  /* 关掉「输入即算」后，运行按钮成了唯一入口，给它一点存在感 */
  body[data-auto="off"] #runBtn { border-color: var(--accent); color: var(--accent); }

  /* 历史 */
  .hist {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 4px 6px;
    border-radius: 5px;
    cursor: pointer;
  }
  .hist:hover { background: var(--hover); }
  .hist .tool {
    flex: none;
    max-width: 84px;
    padding: 0 5px;
    border-radius: 4px;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 10px;
    line-height: 16px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .hist .txt {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 11.5px;
  }
  .hist .del {
    flex: none;
    width: 18px;
    height: 18px;
    padding: 0;
    border: none;
    border-radius: 4px;
    color: var(--muted);
    line-height: 1;
    opacity: 0;
  }
  .hist:hover .del { opacity: 1; }
  .hist .del:hover { background: var(--line); color: var(--fg); }

  /* 底栏 */
  footer {
    flex: none;
    padding: 6px 8px;
    border-top: 1px solid var(--line);
    background: var(--bg);
  }
  footer .wrap {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  footer .check span { color: var(--muted); font-size: 11px; }

  /* 轻提示 */
  .toast {
    position: fixed;
    left: 50%;
    bottom: 46px;
    transform: translate(-50%, 8px);
    max-width: calc(100% - 24px);
    padding: 6px 14px;
    border-radius: 999px;
    background: #2b3038;
    color: #fff;
    font-size: 11.5px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, .28);
    opacity: 0;
    pointer-events: none;
    transition: opacity .18s, transform .18s;
  }
  @media (prefers-color-scheme: dark) {
    .toast { background: #3a4048; }
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<header>
 <div class="wrap">
  <button class="picker" id="pickerBtn" aria-haspopup="listbox" aria-expanded="false" title="选择工具">
    <span class="picker-name" id="pickerName">载入中…</span>
    <svg class="chev" width="10" height="10" viewBox="0 0 10 10" aria-hidden="true">
      <path d="M1.5 3.5 5 7l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
  <span class="dot" id="status" title="连接中…"></span>

  <div class="palette" id="palette" hidden role="dialog" aria-label="选择工具">
    <div class="palette-head">
      <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true">
        <circle cx="5.2" cy="5.2" r="3.6" fill="none" stroke="currentColor" stroke-width="1.3"/>
        <path d="M7.9 7.9 10.4 10.4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
      </svg>
      <input class="palette-search" id="paletteSearch" type="text" placeholder="搜索工具…" spellcheck="false" autocomplete="off" title="支持键盘：↑↓ 选择，Enter 确认，Esc 关闭">
    </div>
    <div class="palette-list" id="paletteList" role="listbox"></div>
  </div>
 </div>
</header>

<main id="scroll">
 <div class="wrap">
  <section class="block">
    <div class="block-head">
      <span class="block-title">输入</span>
      <span class="block-hint" id="source"></span>
      <span class="grow"></span>
      <span class="block-hint" id="charCount"></span>
      <button class="btn ghost" id="fromEditor" title="读取编辑器里选中的内容">取选区</button>
      <button class="btn" id="runBtn" title="立即运行（Ctrl+Enter）">运行</button>
    </div>
    <div class="input-wrap">
      <textarea id="input" spellcheck="false" placeholder="把内容粘到这里，或在编辑器里选中后执行命令"></textarea>
    </div>
  </section>

  <section class="block">
    <details class="fold" id="optFold">
      <summary>
        <span class="fold-title">选项</span>
        <span class="fold-note" id="optNote"></span>
      </summary>
      <div class="fold-body"><div id="options"></div></div>
    </details>
  </section>

  <section class="block">
    <div class="block-head">
      <span class="block-title">结果</span>
      <span class="grow"></span>
      <button class="btn" id="copyAll" title="复制主结果">
        <svg width="11" height="11" viewBox="0 0 12 12" aria-hidden="true">
          <rect x="4.2" y="4.2" width="6.3" height="6.3" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.2"/>
          <path d="M7.8 4.2V2.9c0-.8-.6-1.4-1.4-1.4H2.9c-.8 0-1.4.6-1.4 1.4v3.5c0 .8.6 1.4 1.4 1.4h1.3" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
        </svg><span class="lb">复制</span>
      </button>
      <button class="btn" id="applyAll" title="把结果写回编辑器（替换选区）">
        <svg width="11" height="11" viewBox="0 0 12 12" aria-hidden="true">
          <path d="M6 1.4v6.2M3.6 5.4 6 7.8l2.4-2.4" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M1.8 9.4v.8c0 .5.4.8.8.8h6.8c.4 0 .8-.3.8-.8v-.8" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
        </svg><span class="lb">写回</span>
      </button>
    </div>
    <div id="sections"></div>
    <ul class="notes" id="notes"></ul>
  </section>

  <details class="fold" id="historyBlock">
    <summary>
      <span class="fold-title">历史</span>
      <span class="fold-note" id="historyCount">暂无记录</span>
    </summary>
    <div class="fold-body"><div id="history"></div></div>
  </details>
 </div>
</main>

<footer>
 <div class="wrap">
  <label class="check"><input type="checkbox" id="autoRun" checked><span>自动计算</span></label>
  <span class="grow"></span>
  <button class="btn ghost" id="clearBtn">清空</button>
 </div>
</footer>

<div class="toast" id="toast"></div>

<script>
(function () {
  var api = window.openidea;
  var hasHost = !!(api && api.postMessage);

  var $ = function (id) { return document.getElementById(id); };
  var el = {
    status: $('status'),
    pickerBtn: $('pickerBtn'),
    pickerName: $('pickerName'),
    palette: $('palette'),
    paletteSearch: $('paletteSearch'),
    paletteList: $('paletteList'),
    input: $('input'),
    source: $('source'),
    charCount: $('charCount'),
    fromEditor: $('fromEditor'),
    runBtn: $('runBtn'),
    optFold: $('optFold'),
    optNote: $('optNote'),
    options: $('options'),
    sections: $('sections'),
    notes: $('notes'),
    copyAll: $('copyAll'),
    applyAll: $('applyAll'),
    historyBlock: $('historyBlock'),
    history: $('history'),
    historyCount: $('historyCount'),
    autoRun: $('autoRun'),
    clearBtn: $('clearBtn'),
    toast: $('toast')
  };

  var state = {
    tools: [],
    byId: {},
    tool: '',
    input: '',
    options: {},
    result: { sections: [], notes: [], primary: '' },
    history: [],
    autoRun: true
  };

  var optionEls = [];   // [{ spec, input }]
  var rebuiltFor = '';  // 已按哪个工具建过控件
  var runTimer = 0;
  var optionTimer = 0;
  var toastTimer = 0;

  var palItems = [];    // 浮层里可键盘选中的项 [{ id, node }]
  var palActive = 0;
  var copyResetTimer = 0;

  function send(obj) {
    obj.now = Date.now();  // 时间类工具靠它，WASM 侧拿不到可靠时钟
    if (hasHost) api.postMessage(JSON.stringify(obj));
    else localHandle(obj);
  }

  function toast(text) {
    el.toast.textContent = text;
    el.toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.toast.classList.remove('show'); }, 1800);
  }

  /* ---------- 工具选择浮层 ---------- */

  function toolGroups(tools) {
    var order = [];
    var groups = {};
    tools.forEach(function (t) {
      var label = t.groupLabel || t.group || '其他';
      if (!groups[label]) { groups[label] = []; order.push(label); }
      groups[label].push(t);
    });
    return order.map(function (label) { return { label: label, tools: groups[label] }; });
  }

  function buildCatalog(tools) {
    state.tools = tools || [];
    state.byId = {};
    state.tools.forEach(function (t) { state.byId[t.id] = t; });
    if (state.tools.length) {
      if (!state.byId[state.tool]) state.tool = state.tools[0].id;
      el.pickerBtn.disabled = false;
    } else {
      el.pickerBtn.disabled = true;
      el.pickerName.textContent = '（没有工具）';
    }
    renderMeta();
  }

  function currentMeta() { return state.byId[state.tool] || null; }

  // 历史里出现过、又不是当前工具的那几个，排在列表最前面
  function recentToolIds() {
    var out = [];
    (state.history || []).forEach(function (h) {
      if (!h || !h.tool) return;
      if (h.tool === state.tool || !state.byId[h.tool]) return;
      if (out.indexOf(h.tool) < 0) out.push(h.tool);
    });
    return out.slice(0, 4);
  }

  function pickerSection(label, list) {
    var head = document.createElement('div');
    head.className = 'pgroup';
    head.textContent = label;
    el.paletteList.appendChild(head);
    list.forEach(function (t) {
      var item = document.createElement('button');
      item.type = 'button';
      item.className = 'pitem' + (t.id === state.tool ? ' on' : '');
      item.setAttribute('role', 'option');
      item.setAttribute('aria-selected', t.id === state.tool ? 'true' : 'false');
      var nm = document.createElement('span');
      nm.className = 'nm';
      nm.textContent = t.name;
      var sm = document.createElement('span');
      sm.className = 'sm';
      sm.textContent = t.summary || '';
      if (t.summary) item.title = t.summary;
      item.appendChild(nm);
      item.appendChild(sm);
      item.addEventListener('click', function () {
        closePicker();
        if (t.id !== state.tool) setTool(t.id);
      });
      el.paletteList.appendChild(item);
      palItems.push({ id: t.id, node: item });
    });
  }

  function renderPicker(query) {
    var q = (query || '').trim().toLowerCase();
    el.paletteList.innerHTML = '';
    palItems = [];
    var hits = 0;

    if (!q) {
      var recent = recentToolIds().map(function (id) { return state.byId[id]; });
      if (recent.length) {
        pickerSection('最近使用', recent);
        hits += recent.length;
      }
    }

    toolGroups(state.tools).forEach(function (g) {
      var matched = g.tools.filter(function (t) {
        if (!q) return true;
        var hay = (t.name + ' ' + (t.summary || '') + ' ' + g.label + ' ' + t.id).toLowerCase();
        return hay.indexOf(q) >= 0;
      });
      if (!matched.length) return;
      pickerSection(g.label, matched);
      hits += matched.length;
    });

    if (!hits) {
      var d = document.createElement('div');
      d.className = 'pempty';
      d.textContent = '没有匹配的工具';
      el.paletteList.appendChild(d);
    }
    // 打开时把光标停在当前工具上，方向键从这里继续
    palActive = 0;
    for (var i = 0; i < palItems.length; i++) {
      if (palItems[i].id === state.tool) { palActive = i; break; }
    }
    markActive(false);
  }

  function markActive(scroll) {
    palItems.forEach(function (p, i) {
      p.node.classList.toggle('on', i === palActive);
    });
    var cur = palItems[palActive];
    if (scroll && cur && cur.node.scrollIntoView) {
      cur.node.scrollIntoView({ block: 'nearest' });
    }
  }

  function openPicker() {
    if (!state.tools.length) return;
    el.palette.hidden = false;
    el.pickerBtn.setAttribute('aria-expanded', 'true');
    el.paletteSearch.value = '';
    renderPicker('');
    el.paletteSearch.focus();
  }

  function closePicker() {
    if (el.palette.hidden) return;
    el.palette.hidden = true;
    el.pickerBtn.setAttribute('aria-expanded', 'false');
  }

  function setTool(id) {
    state.tool = id;
    rebuiltFor = '';
    renderMeta();
    send({ type: 'selectTool', tool: id });
  }

  function renderMeta() {
    var meta = currentMeta();
    if (!meta) return;
    el.pickerName.textContent = meta.name;
    el.pickerBtn.title = meta.summary ? meta.name + ' — ' + meta.summary : meta.name;
    el.input.placeholder = meta.placeholder || '把内容粘到这里';
    if (rebuiltFor !== meta.id) {
      buildOptions(meta);
      rebuiltFor = meta.id;
    }
    syncOptions();
    renderOptNote();
    autoGrow();
    updateCharCount();
  }

  /* ---------- 选项：完全由 OptionSpec 生成 ---------- */

  function buildOptions(meta) {
    el.options.innerHTML = '';
    optionEls = [];
    (meta.options || []).forEach(function (spec) {
      var kind = spec.kind || { kind: 'text' };
      var row, input;
      if (kind.kind === 'bool') {
        row = document.createElement('label');
        row.className = 'check';
        input = document.createElement('input');
        input.type = 'checkbox';
        var span = document.createElement('span');
        span.textContent = spec.label;
        row.appendChild(input);
        row.appendChild(span);
      } else {
        row = document.createElement('div');
        row.className = 'field';
        var lb = document.createElement('label');
        lb.textContent = spec.label;
        row.appendChild(lb);
        if (kind.kind === 'select') {
          input = document.createElement('select');
          (kind.choices || []).forEach(function (c) {
            var o = document.createElement('option');
            o.value = c.value;
            o.textContent = c.label;
            input.appendChild(o);
          });
        } else {
          input = document.createElement('input');
          input.type = kind.kind === 'number' ? 'number' : 'text';
          if (kind.kind === 'number') {
            if (typeof kind.min === 'number') input.min = kind.min;
            if (typeof kind.max === 'number') input.max = kind.max;
            if (typeof kind.step === 'number') input.step = kind.step;
          } else if (kind.placeholder) {
            input.placeholder = kind.placeholder;
          }
        }
        row.appendChild(input);
      }
      if (spec.hint) row.title = spec.hint;
      input.addEventListener('change', function () { onOptionChange(spec, input); });
      if (kind.kind === 'text') {
        input.addEventListener('input', function () { onOptionChange(spec, input); });
      }
      el.options.appendChild(row);
      optionEls.push({ spec: spec, input: input });
    });
  }

  function readOption(spec, input) {
    var kind = (spec.kind && spec.kind.kind) || 'text';
    if (kind === 'bool') return !!input.checked;
    if (kind === 'number') {
      var n = parseFloat(input.value);
      if (isNaN(n)) n = typeof spec.default === 'number' ? spec.default : 0;
      if (typeof spec.kind.min === 'number' && n < spec.kind.min) n = spec.kind.min;
      if (typeof spec.kind.max === 'number' && n > spec.kind.max) n = spec.kind.max;
      return n;
    }
    return input.value;
  }

  function onOptionChange(spec, input) {
    var value = readOption(spec, input);
    state.options[spec.key] = value;
    renderOptNote();
    var kind = (spec.kind && spec.kind.kind) || 'text';
    if (kind !== 'text') {
      send({ type: 'setOption', key: spec.key, value: value });
      return;
    }
    // 文本框边打字边算太吵，停一下再发
    clearTimeout(optionTimer);
    optionTimer = setTimeout(function () {
      send({ type: 'setOption', key: spec.key, value: value });
    }, 220);
  }

  function syncOptions() {
    optionEls.forEach(function (pair) {
      var spec = pair.spec;
      var v = state.options[spec.key];
      if (v === undefined || v === null) v = spec.default;
      var kind = (spec.kind && spec.kind.kind) || 'text';
      // 正在编辑的控件不覆盖，否则光标会跳、小数点的中间状态会被吃掉
      if (document.activeElement === pair.input) return;
      if (kind === 'bool') {
        pair.input.checked = !!v;
      } else {
        var str = v === undefined ? '' : String(v);
        if (pair.input.value !== str) pair.input.value = str;
      }
    });
  }

  // 收起时也能看到当前配置，不用点开
  function renderOptNote() {
    var meta = currentMeta();
    if (!meta) { el.optNote.textContent = ''; return; }
    var parts = [];
    (meta.options || []).forEach(function (spec) {
      var v = state.options[spec.key];
      if (v === undefined || v === null) v = spec.default;
      var kind = spec.kind || { kind: 'text' };
      if (kind.kind === 'bool') {
        if (v) parts.push(spec.label.replace(/^使用\s*/, ''));
      } else if (kind.kind === 'select') {
        var hit = null;
        (kind.choices || []).forEach(function (c) { if (String(c.value) === String(v)) hit = c; });
        if (hit) parts.push(hit.label);
      } else if (String(v) !== '') {
        parts.push(String(v));
      }
    });
    if (!parts.length) {
      el.optNote.textContent = (meta.options || []).length ? '默认' : '无';
      return;
    }
    var text = parts.slice(0, 3).join(' · ');
    if (parts.length > 3) text += ' 等 ' + parts.length + ' 项';
    el.optNote.textContent = text;
    el.optNote.title = parts.join(' · ');
  }

  /* ---------- 输入 ---------- */

  // 空的时候矮、有内容时按行数长，上限 42vh，避免把结果区顶出屏幕
  function autoGrow() {
    var t = el.input;
    t.style.height = 'auto';
    var max = Math.round(window.innerHeight * 0.42);
    var h = Math.max(68, Math.min(t.scrollHeight + 2, max));
    t.style.height = h + 'px';
  }

  function updateCharCount() {
    var n = el.input.value.length;
    el.charCount.textContent = n ? n + ' 字符' : '';
  }

  function scheduleRun() {
    if (!state.autoRun) return;
    clearTimeout(runTimer);
    runTimer = setTimeout(pushInput, 260);
  }

  function pushInput() {
    clearTimeout(runTimer);
    send({ type: 'run', text: el.input.value });
  }

  function syncAuto() {
    document.body.dataset.auto = state.autoRun ? 'on' : 'off';
  }

  /* ---------- 结果 ---------- */

  function flashLabel(btn, text) {
    if (btn.dataset.busy === '1') return;
    var node = btn.querySelector('.lb');
    if (!node) return;
    var old = node.textContent;
    node.textContent = text;
    btn.dataset.busy = '1';
    clearTimeout(copyResetTimer);
    copyResetTimer = setTimeout(function () {
      node.textContent = old;
      btn.dataset.busy = '';
    }, 1400);
  }

  function renderResult() {
    var r = state.result || {};
    var sections = r.sections || [];
    el.sections.innerHTML = '';
    if (!sections.length) {
      var tip = state.autoRun
        ? '输入内容后自动出结果'
        : '填好内容后点「运行」';
      var box = document.createElement('div');
      box.className = 'empty-state';
      box.innerHTML = '<svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">'
        + '<path d="M4 3.5h8l4 4v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-12a1 1 0 0 1 1-1z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>'
        + '<path d="M12 3.5v4h4M6.5 11h7M6.5 14h4.5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>'
        + '<p>' + tip + '<br><kbd>Ctrl</kbd> + <kbd>Enter</kbd> 立即运行</p>';
      el.sections.appendChild(box);
    }
    sections.forEach(function (sec) {
      var wrap = document.createElement('div');
      wrap.className = 'sec';
      var head = document.createElement('div');
      head.className = 'sec-head';
      var title = document.createElement('span');
      title.className = 'sec-title';
      title.textContent = sec.title || '';
      var pre = document.createElement('pre');
      pre.className = 'out';
      pre.textContent = sec.text || '';
      head.appendChild(title);
      // 只有一段时顶栏的「复制」就是这一段，不必再放一个一模一样的按钮
      if (sections.length > 1) {
        var btn = document.createElement('button');
        btn.className = 'btn ghost';
        btn.innerHTML = '<svg width="10" height="10" viewBox="0 0 12 12" aria-hidden="true">'
          + '<rect x="4.2" y="4.2" width="6.3" height="6.3" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.2"/>'
          + '<path d="M7.8 4.2V2.9c0-.8-.6-1.4-1.4-1.4H2.9c-.8 0-1.4.6-1.4 1.4v3.5c0 .8.6 1.4 1.4 1.4h1.3" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>'
          + '<span class="lb">复制</span>';
        btn.addEventListener('click', function () {
          copy(pre.textContent);
          flashLabel(btn, '已复制');
        });
        head.appendChild(btn);
      }
      wrap.appendChild(head);
      wrap.appendChild(pre);
      el.sections.appendChild(wrap);
    });

    el.notes.innerHTML = '';
    (r.notes || []).forEach(function (n) {
      var li = document.createElement('li');
      li.textContent = n;
      el.notes.appendChild(li);
    });

    var empty = !(r.primary || '').trim();
    el.copyAll.disabled = empty;
    el.applyAll.disabled = empty;
  }

  function copy(text) {
    if (!text) return;
    if (hasHost) {
      send({ type: 'copy', text: text });
      return;
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast('已复制'); }, function () { toast('复制失败'); });
    } else {
      toast('预览模式下无法访问剪贴板');
    }
  }

  /* ---------- 历史 ---------- */

  function renderHistory() {
    var items = state.history || [];
    el.historyCount.textContent = items.length ? items.length + ' 条' : '暂无记录';
    el.history.innerHTML = '';
    if (!items.length) {
      var d = document.createElement('div');
      d.className = 'block-hint';
      d.style.padding = '2px 0 4px';
      d.textContent = '运行一次后自动记录，点条目可恢复当时的输入。';
      el.history.appendChild(d);
      return;
    }
    items.forEach(function (item, i) {
      var row = document.createElement('div');
      row.className = 'hist';
      var meta = state.byId[item.tool];
      var tool = document.createElement('span');
      tool.className = 'tool';
      tool.textContent = meta ? meta.name : item.tool;
      tool.title = tool.textContent;
      var txt = document.createElement('span');
      txt.className = 'txt';
      txt.textContent = item.label || '（空输入）';
      var del = document.createElement('button');
      del.className = 'del';
      del.innerHTML = '&times;';
      del.title = '删除这条记录';
      del.addEventListener('click', function (ev) {
        ev.stopPropagation();
        send({ type: 'deleteHistory', index: i });
      });
      row.title = '点一下恢复这次输入和选项';
      row.addEventListener('click', function () {
        send({ type: 'history', index: i });
      });
      row.appendChild(tool);
      row.appendChild(txt);
      row.appendChild(del);
      el.history.appendChild(row);
    });
  }

  /* ---------- 快照 ---------- */

  function applySnapshot(msg) {
    state.tool = msg.tool || state.tool;
    state.input = msg.input || '';
    state.options = msg.options || {};
    state.result = msg.result || { sections: [], notes: [], primary: '' };
    state.history = msg.history || [];
    state.autoRun = msg.autoRun !== false;

    if (document.activeElement !== el.input && el.input.value !== state.input) {
      el.input.value = state.input;
    }
    el.source.textContent = msg.source || '';
    el.autoRun.checked = state.autoRun;
    syncAuto();
    renderMeta();
    renderResult();
    renderHistory();
    updateCharCount();
  }

  /* ---------- 事件 ---------- */

  el.pickerBtn.addEventListener('click', function () {
    if (el.palette.hidden) openPicker(); else closePicker();
  });

  el.paletteSearch.addEventListener('input', function () {
    renderPicker(el.paletteSearch.value);
  });

  el.paletteSearch.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      if (!palItems.length) return;
      palActive = (palActive + (e.key === 'ArrowDown' ? 1 : -1) + palItems.length) % palItems.length;
      markActive(true);
    } else if (e.key === 'Enter') {
      e.preventDefault();
      var hit = palItems[palActive];
      if (!hit) return;
      closePicker();
      if (hit.id !== state.tool) setTool(hit.id);
    }
  });

  // 点浮层外面就关掉。捕获阶段拦一下，免得这一下同时按到被遮住的按钮
  document.addEventListener('click', function (e) {
    if (el.palette.hidden) return;
    if (el.palette.contains(e.target) || el.pickerBtn.contains(e.target)) return;
    e.stopPropagation();
    e.preventDefault();
    closePicker();
  }, true);

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !el.palette.hidden) {
      e.preventDefault();
      closePicker();
      el.pickerBtn.focus();
    }
  });

  // 面板被切走再切回来时，别让浮层悬在那
  window.addEventListener('blur', closePicker);

  el.input.addEventListener('input', function () {
    autoGrow();
    updateCharCount();
    scheduleRun();
  });

  el.input.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
      e.preventDefault();
      pushInput();
    }
  });

  el.fromEditor.addEventListener('click', function () { send({ type: 'readEditor' }); });
  el.runBtn.addEventListener('click', pushInput);

  el.copyAll.addEventListener('click', function () {
    copy((state.result || {}).primary);
    flashLabel(el.copyAll, '已复制');
  });

  el.applyAll.addEventListener('click', function () {
    send({ type: 'apply' });
    flashLabel(el.applyAll, '已写回');
  });

  el.clearBtn.addEventListener('click', function () {
    el.input.value = '';
    autoGrow();
    send({ type: 'clear' });
  });

  el.autoRun.addEventListener('change', function () {
    state.autoRun = el.autoRun.checked;
    syncAuto();
    renderResult();  // 空态文案要跟着开关走
    send({ type: 'setAutoRun', value: state.autoRun });
  });

  /* ---------- 没有宿主时的本地预览 ---------- */

  function localHandle(msg) {
    if (!state.tools.length) {
      buildCatalog([
        {
          id: 'json-to-pojo', name: 'JSON → POJO', group: 'code', groupLabel: '代码',
          summary: '把 JSON 样例转成带注解的 Java 类',
          placeholder: '{\n  "id": 1,\n  "user_name": "张三"\n}', needsInput: true, language: 'java',
          options: [
            { key: 'className', label: '根类名', kind: { kind: 'text', placeholder: 'Root / Item' }, default: '', hint: '留空时对象用 Root、数组用 Item' },
            { key: 'lombok', label: '使用 Lombok @Data', kind: { kind: 'bool' }, default: true, hint: '关闭后展开 getter / setter' },
            { key: 'fieldNaming', label: '字段命名', kind: { kind: 'select', choices: [{ value: 'camel', label: 'camelCase' }, { value: 'snake', label: 'snake_case' }, { value: 'keep', label: '保持原样' }] }, default: 'camel', hint: '' }
          ]
        },
        {
          id: 'timestamp', name: '时间戳转换', group: 'time', groupLabel: '时间',
          summary: '时间戳与日期互转，支持秒/毫秒自动识别',
          placeholder: '1704083400000', needsInput: true, language: 'text',
          options: [
            { key: 'timezone', label: '时区', kind: { kind: 'select', choices: [{ value: '480', label: 'UTC+8 北京' }, { value: '0', label: 'UTC' }] }, default: '480', hint: '换算用的偏移分钟数' }
          ]
        }
      ]);
      state.tool = state.tools[0].id;
      renderMeta();
    }
    state.tool = msg.tool || state.tool;
    if (typeof msg.text === 'string') state.input = msg.text;
    if (msg.type === 'setOption') state.options[msg.key] = msg.value;
    if (msg.type === 'selectTool') { state.tool = msg.tool; renderMeta(); }
    if (msg.type === 'setAutoRun') state.autoRun = msg.value;
    if (msg.type === 'clear') { state.input = ''; el.input.value = ''; }
    if (msg.type === 'readEditor') toast('预览模式下没有编辑器');
    if (msg.type === 'copy') toast('预览模式下无法访问剪贴板');
    if (msg.type === 'apply') toast('预览模式下没有编辑器');

    var meta = currentMeta();
    var body = state.input.trim();
    state.result = {
      sections: body
        ? [{ title: '预览结果', text: '（示例）工具「' + (meta ? meta.name : '') + '」的输出会出现在这里。\n\n输入：\n' + body, language: 'text' }]
        : [],
      notes: ['当前是浏览器本地预览，只用于调样式；真实计算需要 OpenIDEA 宿主。'],
      primary: body
    };
    if (el.input.value !== state.input) el.input.value = state.input;
    renderResult();
    renderHistory();
    autoGrow();
    updateCharCount();
    el.status.classList.remove('ok');
    el.status.title = '本地预览模式';
  }

  /* ---------- 启动 ---------- */

  if (hasHost && api.onMessage) {
    api.onMessage(function (text) {
      var msg;
      try { msg = JSON.parse(text); } catch (e) { return; }
      if (msg.type === 'catalog') {
        buildCatalog(msg.tools);
        el.status.classList.add('ok');
        el.status.title = '已连接 OpenIDEA';
      } else if (msg.type === 'snapshot') {
        applySnapshot(msg);
      } else if (msg.type === 'toast') {
        toast(msg.text || '');
      }
    });
    syncAuto();
    // 必须发 init：插件靠它载入 storage、更新状态栏并回第一帧。
    send({ type: 'init' });
  } else {
    syncAuto();
    localHandle({ type: 'init' });
  }
})();
</script>
</body>
</html>
